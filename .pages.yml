media:
  input: public/images/gallery
  output: /images/gallery
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: site
    label: Dane strony
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: company, label: Nazwa firmy, type: string }
      - { name: title, label: Tytuł strony, type: string }
      - { name: description, label: Opis dla Google, type: text }
      - { name: intro, label: Tekst o firmie, type: text }
      - { name: experience, label: Lata doświadczenia, type: string }
      - { name: customers, label: Zadowoleni klienci, type: string }
      - { name: phoneFurniture, label: Telefon – meble i kuchnie, type: string }
      - { name: phoneFurnitureLabel, label: Opis pierwszego telefonu, type: string }
      - { name: phoneJoinery, label: Telefon – schody i drzwi, type: string }
      - { name: phoneJoineryLabel, label: Opis drugiego telefonu, type: string }
      - { name: contactText, label: Tekst kontaktowy, type: text }
      - { name: copyright, label: Nazwa w stopce, type: string }

      - name: fontMenu
        label: "Rozmiar menu (px)"
        type: string
        default: "20"

      - name: fontAbout
        label: "Rozmiar tekstu o firmie (px)"
        type: string
        default: "20"

      - name: fontStats
        label: "Rozmiar dużych liczb 10+ / 657+ (px)"
        type: string
        default: "68"

      - name: fontStatsLabel
        label: "Rozmiar podpisów pod statystykami (px)"
        type: string
        default: "16"

      - name: fontContactTitle
        label: "Rozmiar tytułu „Skontaktuj się z nami” (px)"
        type: string
        default: "42"

      - name: fontContact
        label: "Rozmiar danych kontaktowych (px)"
        type: string
        default: "18"

      - name: fontFooter
        label: "Rozmiar tekstu w stopce (px)"
        type: string
        default: "14"

  - name: gallery
    label: Galeria
    type: file
    path: src/data/gallery.json
    format: json
    fields:
      - name: images
        label: Zdjęcia
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - { name: src, label: Plik zdjęcia, type: image, required: true }
          - { name: alt, label: Opis zdjęcia, type: string, required: true }
